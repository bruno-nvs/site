<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <header>

        <section id="desafio">

            <h2>Desafio</h2>

            <form id="form" name="form" action="">

                <div>
                    <label for="nome">Nome Completo: </label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">E-mail: </label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="idade">Idade: </label>
                    <input type="number" id="idade" name="idade" required>
                </div>

                <div>
                    <label for="assunto">Assunto: </label>
                    <input type="text" id="text" name="text" required>
                </div>

                <div>
                    <label for="materia">Para qual matéria você está se candidatando para lecionar: </label>
                    <select name="materia" id="materia" required>
                        <option value="" disabled selected></option>
                        <option value="matematica">Matemática</option>
                        <option value="portugues">Português</option>
                        <option value="biologia">Biologia</option>
                        <option value="ciencias">Ciências</option>
                        <option value="historia">História</option>
                        <option value="geografia">Geografia</option>
                        <option value="artes">Artes</option>
                    </select>
                </div>

                <div>
                    <label for="turnos_disponiveis">Turnos disponíveis: </label>
                    <select name="turnos_disponiveis" id="turnos_disponiveis" required>
                        <option value="" disabled selected></option>
                        <option value="matutino">Matutino</option>
                        <option value="vespertino">Vespertino</option>
                        <option value="noturno">Noturno</option>
                        <option value="integral">Integral</option>
                    </select>
                </div>

                <div>
                    <label for="escolaridade">Nível de escolaridade: </label>
                    <select name="escolaridade" id="escolaridade" required>
                        <option value="" disabled selected></option>
                        <option value="superior">Ensino Superior Completo</option>
                        <option value="cursando_mestrado">Cursando Mestrado</option>
                        <option value="mestrado_completo">Mestrado Completo</option>
                        <option value="cursando_doutorado">Cursando Doutorado</option>
                        <option value="doutorado_completo">Doutorado Completo</option>
                    </select>
                </div>

                <div>
                    <label for="descricao">Descrição sobre si mesmo: </label>
                    <textarea name="descricao" id="descricao" maxlength="200" cols="30" rows="10" required></textarea>
                </div>

                <input type="submit" value="Enviar mensagem">

            </form>

        </section>

    </header>

</body>

</html>
